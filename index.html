<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hệ thống Quét Mã Vé Sự Kiện</title>
    <!-- Tailwind CSS v4 -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- Thư viện Quét QR -->
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        /* Tùy chỉnh giao diện camera */
        #reader { border: none !important; }
        #reader video { border-radius: 0.75rem; object-fit: cover; }
        #reader__dashboard_section_csr button {
            background-color: #10b981 !important; color: #ffffff !important;
            border: none !important; padding: 8px 16px !important;
            border-radius: 0.5rem !important; font-weight: 600 !important;
            cursor: pointer; margin-top: 10px;
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col font-sans antialiased">

    <!-- HEADER -->
    <header class="bg-slate-900/80 backdrop-blur-md border-b border-slate-800 p-4 sticky top-0 z-50 shadow-lg">
        <div class="max-w-md mx-auto flex items-center justify-center gap-2">
            <div class="w-3 h-3 rounded-full bg-emerald-500 animate-pulse"></div>
            <h1 class="text-lg font-bold tracking-wide uppercase bg-gradient-to-r from-emerald-400 to-teal-200 bg-clip-text text-transparent">
                Event Check-in
            </h1>
        </div>
    </header>

    <!-- MAIN CONTENT -->
    <main class="max-w-md w-full mx-auto p-4 flex flex-col gap-5 mt-2">

        <!-- KHU VỰC CAMERA SCANNER -->
        <section class="bg-slate-900 border border-slate-800 rounded-2xl p-4 shadow-xl">
            <div class="flex justify-between items-center mb-3">
                <h2 class="text-sm font-semibold text-slate-300 flex items-center gap-2">
                    <i data-lucide="qr-code" class="w-4 h-4 text-emerald-400"></i> Quét mã QR
                </h2>
                <span id="scanner-status" class="text-[10px] bg-emerald-950 text-emerald-400 border border-emerald-800 px-2 py-0.5 rounded transition-colors duration-300">
                    Sẵn sàng
                </span>
            </div>
            
            <div class="relative bg-slate-950 rounded-xl overflow-hidden border border-slate-800 min-h-[250px] flex items-center justify-center">
                <div id="reader" class="w-full"></div>
            </div>
        </section>

        <!-- KẾT QUẢ TRẢ VỀ (ẨN MẶC ĐỊNH) -->
        <section id="result-card" class="hidden transition-all duration-300"></section>

        <!-- NHẬP MÃ THỦ CÔNG -->
        <section class="bg-slate-900/40 border border-slate-800/80 rounded-xl p-3">
            <label for="manual-code" class="block text-xs text-slate-400 mb-2">Hoặc nhập mã vé thủ công</label>
            <div class="flex gap-2">
                <input type="text" id="manual-code" placeholder="Nhập mã vé..." 
                       class="bg-slate-950 border border-slate-700 focus:border-emerald-500 text-slate-100 text-sm rounded-lg px-3 py-2 w-full outline-none transition uppercase">
                <button id="btn-manual" class="bg-slate-800 hover:bg-slate-700 text-emerald-400 font-semibold px-4 py-2 rounded-lg text-sm border border-slate-700 flex items-center gap-1 transition disabled:opacity-50 disabled:cursor-not-allowed">
                    <i data-lucide="search" class="w-4 h-4"></i> Check
                </button>
            </div>
        </section>

    </main>

    <!-- SCRIPT XỬ LÝ LOGIC -->
    <script>
        lucide.createIcons();

        // ==========================================
        // 1. CẤU HÌNH APP SCRIPT URL CỦA BẠN VÀO ĐÂY
        // ==========================================
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbw3LH-YJtI7DGZsInMtntYr5R_-Fl-VcMThvYwrDEHEMDt0ueI5iKyKeKjxU3sgeNkvWw/exec"; // THAY URL CỦA BẠN VÀO

        let isProcessing = false;
        const resultCard = document.getElementById('result-card');
        const scannerStatus = document.getElementById('scanner-status');

        // Render giao diện Kết quả
        function renderResult(type, data = {}) {
            resultCard.classList.remove('hidden');
            
            if (type === 'loading') {
                resultCard.className = "bg-slate-800 border border-slate-700 rounded-2xl p-4 shadow-lg flex items-center justify-center gap-3";
                resultCard.innerHTML = `
                    <i data-lucide="loader-2" class="w-5 h-5 text-emerald-400 animate-spin"></i>
                    <span class="text-sm text-slate-300">Đang kiểm tra dữ liệu...</span>
                `;
            } 
            else if (type === 'success') {
                resultCard.className = "bg-emerald-950/40 border border-emerald-500/40 rounded-2xl p-4 shadow-lg backdrop-blur-sm";
                resultCard.innerHTML = `
                    <div class="flex items-start gap-3">
                        <div class="w-10 h-10 rounded-full bg-emerald-500/20 text-emerald-400 flex items-center justify-center border border-emerald-500/30 shrink-0">
                            <i data-lucide="check-circle-2" class="w-6 h-6"></i>
                        </div>
                        <div class="w-full">
                            <span class="text-[10px] font-bold tracking-wider uppercase bg-emerald-500/20 text-emerald-300 px-2 py-0.5 rounded">
                                ${data.message}
                            </span>
                            <h3 class="text-lg font-bold text-slate-100 mt-1">${data.name || 'Khách mời'}</h3>
                            <div class="mt-2 text-xs text-slate-300 bg-slate-900/50 p-2 rounded border border-slate-700/50">
                                <span class="text-slate-400">Chức vụ/Vị trí:</span> <span class="font-semibold text-amber-400">${data.position || 'Không có'}</span>
                            </div>
                        </div>
                    </div>
                `;
            } 
            else if (type === 'error') {
                resultCard.className = "bg-rose-950/40 border border-rose-500/40 rounded-2xl p-4 shadow-lg backdrop-blur-sm";
                resultCard.innerHTML = `
                    <div class="flex items-center gap-3">
                        <div class="w-10 h-10 rounded-full bg-rose-500/20 text-rose-400 flex items-center justify-center border border-rose-500/30 shrink-0">
                            <i data-lucide="x-circle" class="w-6 h-6"></i>
                        </div>
                        <div>
                            <span class="text-[10px] font-bold tracking-wider uppercase bg-rose-500/20 text-rose-300 px-2 py-0.5 rounded">Thất bại</span>
                            <h3 class="text-sm font-semibold text-slate-200 mt-1">${data.message || 'Có lỗi xảy ra'}</h3>
                        </div>
                    </div>
                `;
            }
            lucide.createIcons(); // Re-render icons
        }

        // Hàm Gửi API lên Google Apps Script
        async function processTicket(ticketCode) {
            if (isProcessing) return; // Chống spam
            if (!ticketCode) return;

            isProcessing = true;
            scannerStatus.textContent = "Đang xử lý...";
            scannerStatus.className = "text-[10px] bg-amber-950 text-amber-400 border border-amber-800 px-2 py-0.5 rounded";
            
            // Hiện loading
            renderResult('loading');

            try {
                // Post dữ liệu dạng text/plain để tránh lỗi CORS Preflight của Google Script
                const response = await fetch(SCRIPT_URL, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'text/plain;charset=utf-8',
                    },
                    body: JSON.stringify({ ticket: ticketCode })
                });

                const resData = await response.json();

                if (resData.success) {
                    renderResult('success', resData);
                } else {
                    renderResult('error', resData);
                }

            } catch (error) {
                console.error("Lỗi kết nối:", error);
                renderResult('error', { message: "Lỗi kết nối máy chủ mạng." });
            } finally {
                // Reset trạng thái sau 3 giây để sẵn sàng quét mã tiếp theo
                setTimeout(() => {
                    isProcessing = false;
                    scannerStatus.textContent = "Sẵn sàng";
                    scannerStatus.className = "text-[10px] bg-emerald-950 text-emerald-400 border border-emerald-800 px-2 py-0.5 rounded";
                    // Tùy chọn: document.getElementById('manual-code').value = ''; 
                }, 3000);
            }
        }

        // ==========================================
        // CẤU HÌNH SCANNER BẰNG CAMERA
        // ==========================================
        function onScanSuccess(decodedText) {
            processTicket(decodedText);
        }

        function onScanFailure(error) { /* Bỏ qua lỗi khung hình */ }

        let html5QrcodeScanner = new Html5QrcodeScanner(
            "reader", { fps: 10, qrbox: { width: 250, height: 250 }, aspectRatio: 1.0 }, false
        );
        html5QrcodeScanner.render(onScanSuccess, onScanFailure);

        // ==========================================
        // XỬ LÝ NHẬP MÃ THỦ CÔNG
        // ==========================================
        const btnManual = document.getElementById('btn-manual');
        const inputManual = document.getElementById('manual-code');

        btnManual.addEventListener('click', () => {
            processTicket(inputManual.value.trim());
        });

        inputManual.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                processTicket(inputManual.value.trim());
            }
        });

    </script>
</body>
</html>
